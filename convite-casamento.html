<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michel & Luiza — 25.07.2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Josefin+Sans:wght@200;300;400&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --olive: #6B7A5E;
      --olive-light: #8A9A7A;
      --cream: #F7F3ED;
      --warm: #C8B89A;
      --warm-light: #D9CCBA;
      --warm-dark: #A89878;
      --text: #3A3832;
      --text-light: #7A756D;
      --border: #C2B9A7;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: #3A3832;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ========== CONVITE HORIZONTAL ========== */
    .invitation {
      width: 100%;
      max-width: 920px;
      aspect-ratio: 7 / 5;
      background: var(--cream);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 40px rgba(0,0,0,0.15);
    }

    /* Borda interna */
    .invitation::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      bottom: 18px;
      border: 1px solid var(--border);
      pointer-events: none;
      z-index: 2;
    }

    .invitation::after {
      content: '';
      position: absolute;
      top: 22px;
      left: 22px;
      right: 22px;
      bottom: 22px;
      border: 0.5px solid rgba(194, 185, 167, 0.35);
      pointer-events: none;
      z-index: 2;
    }

    /* ========== TEXTURA SUTIL ========== */
    .texture {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.025;
      background-image:
        radial-gradient(circle at 25% 35%, var(--olive) 0.8px, transparent 0.8px),
        radial-gradient(circle at 75% 65%, var(--olive) 0.8px, transparent 0.8px);
      background-size: 50px 50px, 70px 70px;
      z-index: 0;
    }

    /* ========== LAYOUT PRINCIPAL ========== */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 64px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ========== MONOGRAMA ENTRELAÇADO ========== */
    .monogram {
      margin-bottom: 28px;
    }

    .monogram svg {
      width: 130px;
      height: 130px;
    }

    /* ========== TEXTO CONVITE ========== */
    .invite-line {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.62rem;
      font-weight: 300;
      color: var(--text-light);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* ========== NOMES DO CASAL ========== */
    .couple {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: nowrap;
    }

    .couple__name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 400;
      color: var(--text);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1;
    }

    .couple__and {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 300;
      font-style: italic;
      color: var(--olive);
      letter-spacing: 0.04em;
    }

    /* ========== LINHA DECORATIVA ========== */
    .line-decor {
      width: 60px;
      height: 0.5px;
      background: var(--warm);
      margin: 0 auto 24px;
    }

    /* ========== INFO EVENTO ========== */
    .event-info {
      margin-bottom: 8px;
    }

    .event-info__text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--text-light);
      line-height: 1.8;
      letter-spacing: 0.02em;
    }

    .event-info__text em {
      font-style: italic;
      color: var(--warm-dark);
    }

    /* ========== DATA DESTACADA ========== */
    .date-highlight {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--text-light);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ========== LINHAS DECORATIVAS DUPLAS ========== */
    .double-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin: 20px auto;
    }

    .double-line__bar {
      width: 40px;
      height: 0.5px;
      background: var(--warm);
    }

    /* ========== RSVP ========== */
    .rsvp {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.58rem;
      font-weight: 300;
      color: var(--warm-dark);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-top: 4px;
    }

    /* ========== BOTANICO CANTOS ========== */
    .botanical {
      position: absolute;
      z-index: 1;
      opacity: 0.06;
    }

    .botanical--tl {
      top: -10px;
      left: -15px;
      width: 180px;
      transform: rotate(15deg);
    }

    .botanical--br {
      bottom: -10px;
      right: -15px;
      width: 180px;
      transform: rotate(195deg);
    }

    .botanical svg {
      width: 100%;
      height: auto;
    }

    /* ========== ANIMACOES ========== */
    .fade-up {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 1s ease forwards;
    }

    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.3s; }
    .d3 { animation-delay: 0.5s; }
    .d4 { animation-delay: 0.7s; }
    .d5 { animation-delay: 0.9s; }
    .d6 { animation-delay: 1.1s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 700px) {
      .invitation {
        aspect-ratio: auto;
        padding: 0;
      }

      .content {
        padding: 40px 28px;
      }

      .couple {
        flex-direction: column;
        gap: 4px;
        align-items: center;
      }

      .couple__name {
        font-size: 1.6rem;
      }

      .couple__and {
        font-size: 1.2rem;
      }

      .parents {
        flex-direction: column;
        gap: 12px;
      }

      .monogram svg {
        width: 50px;
        height: 50px;
      }

      .invitation::before {
        top: 12px; left: 12px; right: 12px; bottom: 12px;
      }

      .invitation::after {
        top: 16px; left: 16px; right: 16px; bottom: 16px;
      }
    }

    @media (max-width: 480px) {
      .couple__name {
        font-size: 1.3rem;
        letter-spacing: 0.08em;
      }
    }
  </style>
</head>
<body>

  <div class="invitation">
    <div class="texture"></div>

    <!-- Botanicos sutis nos cantos -->
    <div class="botanical botanical--tl">
      <svg viewBox="0 0 200 300" fill="none">
        <path d="M100 280 Q80 200 40 160 Q20 140 10 100 Q5 60 30 30 Q50 10 80 20 Q100 30 100 60" stroke="#6B7A5E" stroke-width="1.2" fill="none"/>
        <path d="M100 280 Q90 220 60 180 Q40 160 35 130 Q30 100 50 80 Q65 65 80 75" stroke="#6B7A5E" stroke-width="0.8" fill="none"/>
        <path d="M100 280 Q110 210 130 170 Q150 140 155 110 Q160 80 140 55 Q125 40 110 50" stroke="#6B7A5E" stroke-width="1" fill="none"/>
      </svg>
    </div>

    <div class="botanical botanical--br">
      <svg viewBox="0 0 200 300" fill="none">
        <path d="M100 280 Q80 200 40 160 Q20 140 10 100 Q5 60 30 30 Q50 10 80 20 Q100 30 100 60" stroke="#6B7A5E" stroke-width="1.2" fill="none"/>
        <path d="M100 280 Q90 220 60 180 Q40 160 35 130 Q30 100 50 80 Q65 65 80 75" stroke="#6B7A5E" stroke-width="0.8" fill="none"/>
        <path d="M100 280 Q110 210 130 170 Q150 140 155 110 Q160 80 140 55 Q125 40 110 50" stroke="#6B7A5E" stroke-width="1" fill="none"/>
      </svg>
    </div>

    <div class="content">

      <!-- Monograma M&L para bordado -->
      <div class="monogram fade-up d1">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Circulo externo elegante -->
          <circle cx="100" cy="100" r="88" stroke="#6B7A5E" stroke-width="0.8"/>
          <circle cx="100" cy="100" r="84" stroke="#C2B9A7" stroke-width="0.4"/>
          <!-- Ramos de oliveira esquerda -->
          <path d="M30 100 Q38 88 42 78" stroke="#6B7A5E" stroke-width="0.7" fill="none"/>
          <ellipse cx="36" cy="86" rx="4" ry="8" transform="rotate(-25 36 86)" stroke="#6B7A5E" stroke-width="0.5" fill="none"/>
          <ellipse cx="40" cy="76" rx="3.5" ry="7" transform="rotate(-15 40 76)" stroke="#6B7A5E" stroke-width="0.5" fill="none"/>
          <ellipse cx="33" cy="94" rx="4" ry="8" transform="rotate(-35 33 94)" stroke="#6B7A5E" stroke-width="0.5" fill="none"/>
          <!-- Ramos de oliveira direita -->
          <path d="M170 100 Q162 88 158 78" stroke="#6B7A5E" stroke-width="0.7" fill="none"/>
          <ellipse cx="164" cy="86" rx="4" ry="8" transform="rotate(25 164 86)" stroke="#6B7A5E" stroke-width="0.5" fill="none"/>
          <ellipse cx="160" cy="76" rx="3.5" ry="7" transform="rotate(15 160 76)" stroke="#6B7A5E" stroke-width="0.5" fill="none"/>
          <ellipse cx="167" cy="94" rx="4" ry="8" transform="rotate(35 167 94)" stroke="#6B7A5E" stroke-width="0.5" fill="none"/>
          <!-- Letra M -->
          <text x="58" y="116" font-family="'Cormorant Garamond', serif" font-size="56" font-weight="300" font-style="italic" fill="#6B7A5E">M</text>
          <!-- Ampersand pequeno -->
          <text x="100" y="124" font-family="'Cormorant Garamond', serif" font-size="22" font-weight="300" font-style="italic" fill="#A89878" text-anchor="middle" opacity="0.8">&amp;</text>
          <!-- Letra L -->
          <text x="108" y="116" font-family="'Cormorant Garamond', serif" font-size="56" font-weight="300" font-style="italic" fill="#6B7A5E">L</text>
          <!-- Linha decorativa inferior -->
          <line x1="70" y1="130" x2="130" y2="130" stroke="#C2B9A7" stroke-width="0.5"/>
        </svg>
      </div>

      <!-- Texto convite -->
      <p class="invite-line fade-up d2">Convidam para celebrar o seu casamento</p>

      <!-- Nomes do casal -->
      <div class="couple fade-up d2">
        <span class="couple__name">Michel</span>
        <span class="couple__and">e</span>
        <span class="couple__name">Luiza</span>
      </div>

      <!-- Linha decorativa -->
      <div class="line-decor fade-up d3"></div>

      <!-- Info do evento -->
      <div class="event-info fade-up d4">
        <p class="date-highlight">Sabado, vinte e cinco de julho de dois mil e vinte e seis</p>
        <p class="event-info__text" style="margin-top: 12px;">Taquara, Rio Grande do Sul</p>
        <p class="event-info__text"><em>Local e horario a confirmar</em></p>
      </div>

      <!-- Linhas duplas decorativas -->
      <div class="double-line fade-up d5">
        <div class="double-line__bar"></div>
        <div class="double-line__bar"></div>
      </div>

      <!-- RSVP -->
      <p class="rsvp fade-up d5">Sera uma alegria ter voce conosco</p>

    </div>
  </div>

</body>
</html>
